name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  program:
    name: Anchor program (build + test)
    runs-on: ubuntu-latest
    env:
      # Keep this in step with the anchor-lang version pinned in
      # pixelvault/programs/pixelvault/Cargo.toml.
      ANCHOR_VERSION: "1.2.0"
    defaults:
      run:
        working-directory: pixelvault
    steps:
      - uses: actions/checkout@v4

      # Picks up the toolchain pinned in pixelvault/rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Solana CLI and Anchor CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/anchor
          key: solana-anchor-${{ runner.os }}-${{ env.ANCHOR_VERSION }}

      - name: Install Solana CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"

      - name: Add Solana CLI to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked anchor-cli --version "$ANCHOR_VERSION"

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pixelvault/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pixelvault/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # The deploy keypair isn't committed, so CI's generated one never matches declare_id!.
      - name: anchor build
        run: anchor build --ignore-keys

      # The tests sign init_protocol as the hard-coded PROTOCOL_ADMIN.
      - name: Write protocol admin keypair
        env:
          SOLANA_ADMIN_KEYPAIR: ${{ secrets.SOLANA_ADMIN_KEYPAIR }}
        run: |
          if [ -z "$SOLANA_ADMIN_KEYPAIR" ]; then
            echo "::error::Repository secret SOLANA_ADMIN_KEYPAIR is not set (JSON byte array of the PROTOCOL_ADMIN keypair)."
            exit 1
          fi
          mkdir -p ~/.config/solana
          printf '%s' "$SOLANA_ADMIN_KEYPAIR" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: cargo test
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      # The SDK's end-to-end tests run against the program built above.
      - name: SDK typecheck, tests and build
        working-directory: sdk
        env:
          PIXELVAULT_REQUIRE_PROGRAM: "1"
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            sdk/package-lock.json
            web/package-lock.json

      - name: Build SDK
        working-directory: sdk
        run: npm ci && npm run build

      - name: Build web app
        working-directory: web
        run: npm ci && npm run build

  deploy-functions:
    name: Deploy functions (install + import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            sdk/package-lock.json
            deploy/racer/package-lock.json

      - name: Build SDK
        working-directory: sdk
        run: npm ci && npm run build

      - name: Install, sync and import every API module
        run: |
          (cd deploy/racer && npm ci)
          node tools/sync-data.mjs
          node tools/check-api.mjs

      - name: Relayer rule tests
        run: node --test deploy/racer/test/*.test.mjs

  glyph-rules:
    name: Glyph Forge rules (C# matches server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Mono
        run: sudo apt-get update -q && sudo apt-get install -y -q mono-mcs mono-runtime

      - name: Check the Unity runner simulation against the server's vectors
        run: tools/glyph-verify.sh
